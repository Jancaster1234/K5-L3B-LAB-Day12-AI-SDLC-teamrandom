<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;
let hc = false;  // Ticket-04: chế độ tương phản cao (phím H)
try { hc = localStorage.getItem("chonoi.hc") === "1"; } catch (e) { /* không có storage */ }

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "", pendingBuy = null;

function currentInput() {
  const mode = snap ? (snap.phase || snap.mode) : "gather";  // day: theo pha hiện tại
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  const out = { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"),
                pause: down.has("pause"), shop_done: down.has("shop_done") };
  if (pendingBuy) { out.buy = pendingBuy; pendingBuy = null; }
  return out;
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  else if (k === "escape" || k === "p") down.add("pause");
  else if (k === "enter") down.add("shop_done");
  else if (k === "1") pendingBuy = "oxygen";
  else if (k === "2") pendingBuy = "hp";
  else if (k === "h") { hc = !hc; try { localStorage.setItem("chonoi.hc", hc ? "1" : "0"); } catch (e) { /* bỏ qua */ } }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  else if (k === "escape" || k === "p") down.delete("pause");
  else if (k === "enter") down.delete("shop_done");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

// ---------- sprite (Kenney Fish Pack, CC0 — xem CREDITS.md). Chưa tải xong / lỗi thì vẽ hình khối như cũ ----------
const SPR = {};
["fish_blue", "fish_green", "fish_grey_long_a", "bubble_a", "bubble_b", "seaweed_green_a", "seaweed_green_b", "seaweed_grass_a",
 "seaweed_pink_a", "seaweed_orange_a", "rock_a", "rock_b", "background_seaweed_a", "background_seaweed_b", "background_rock_a",
 "terrain_sand_top_a", "terrain_sand_a"].forEach((n) => { const im = new Image(); im.src = "/assets/kenney-fish/" + n + ".png"; SPR[n] = im; });
const ok = (n) => SPR[n] && SPR[n].complete && SPR[n].naturalWidth > 0;
// cá linh: nhỏ, ánh bạc xanh · cá lóc: to, sẫm · cá kèo: thân dài ở đáy. Kích thước theo mét (đơn vị thế giới).
const FISH_SPRITE = { ca_linh: ["fish_blue", 2.4], ca_loc: ["fish_green", 3.4], ca_keo: ["fish_grey_long_a", 3.4] };
// Trang trí đáy cố định (không ngẫu nhiên, không đi vào luật): [x mét, sprite, cỡ mét]
const DECOR = [[4, "seaweed_green_a", 3], [9, "rock_a", 2.2], [13, "seaweed_pink_a", 2.6], [19, "seaweed_grass_a", 2.4], [24, "seaweed_orange_a", 2],
  [31, "seaweed_green_b", 3.2], [36, "rock_b", 2], [41, "seaweed_pink_a", 2.8], [47, "seaweed_green_a", 3.4], [53, "seaweed_grass_a", 2.2],
  [58, "rock_a", 2.4], [66, "seaweed_orange_a", 2.4], [71, "seaweed_green_b", 3], [79, "seaweed_pink_a", 2.4], [84, "rock_b", 2.2],
  [88, "seaweed_green_a", 3.2], [95, "seaweed_grass_a", 2.6]];
const BACKDROP = [[7, "background_seaweed_a", 6], [22, "background_rock_a", 5], [38, "background_seaweed_b", 7], [55, "background_seaweed_a", 5.5],
  [69, "background_rock_a", 6], [86, "background_seaweed_b", 6.5]];
const bubbles = [];          // bọt khí chỉ để trang trí phía client
const lastPos = {};          // hướng nhìn Cá Sấu suy từ vị trí trước
function sprite(n, x, y, size, flip, alpha) {
  const im = SPR[n], hgt = size * im.naturalHeight / im.naturalWidth;
  ctx.save(); ctx.globalAlpha = alpha ?? 1; ctx.translate(x, y); if (flip) ctx.scale(-1, 1);
  ctx.drawImage(im, -size / 2, -hgt / 2, size, hgt); ctx.restore();
}

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.75)" }));
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.state === "paused" && !snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, w, h);
    text("⏸ TẠM DỪNG", w / 2, h / 2 - 10, { align: "center", size: 32 });
    text("Esc / P: tiếp tục · R: về đầu", w / 2, h / 2 + 24, { align: "center", size: 18, color: "#cfd8dc" });
  }
  if (snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(w / 2 - 190, h / 2 - 50, 380, 100);
    const label = snap.mode === "day" ? "Hoàn thành " + (snap.day || "") + " Ngày · điểm " + snap.score
      : "Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || "");
    text(label, w / 2, h / 2 - 12, { align: "center", size: 20 });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

// Út Sen: trên mặt nước đội nón lá, dưới nước bơi ngang có bình oxy + chân vịt. Hướng nhìn nhớ lại khi bơi thẳng đứng.
let diverLeft = false;
function drawDiver(px, py, p, underwater, s) {
  const a = ((p.heading_deg || 0) * Math.PI) / 180, moving = p.vel && Math.hypot(p.vel[0], p.vel[1]) > 0.05;
  if (Math.abs(Math.cos(a)) > 0.2) diverLeft = Math.cos(a) < 0;
  const t = performance.now() / 1000;
  ctx.save(); ctx.translate(px, py); if (diverLeft) ctx.scale(-1, 1);
  if (!underwater) {
    const bob = Math.sin(t * 2) * 0.06 * s;
    ctx.translate(0, bob);
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.ellipse(0, 0.05 * s, 0.55 * s, 0.35 * s, 0, Math.PI, 0); ctx.fill();   // vai áo
    ctx.fillStyle = "#f1c27d"; ctx.beginPath(); ctx.arc(0, -0.45 * s, 0.32 * s, 0, Math.PI * 2); ctx.fill();             // mặt
    ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(0.12 * s, -0.48 * s, 0.04 * s, 0, Math.PI * 2); ctx.fill();          // mắt
    ctx.fillStyle = "#e9d8a6"; ctx.strokeStyle = "#a88b4a"; ctx.lineWidth = 1;                                             // nón lá
    ctx.beginPath(); ctx.moveTo(-0.85 * s, -0.62 * s); ctx.lineTo(0, -1.25 * s); ctx.lineTo(0.85 * s, -0.62 * s); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(73,176,220,.55)"; ctx.fillRect(-0.9 * s, 0.05 * s, 1.8 * s, 0.4 * s);                           // nước che thân
  } else {
    const tilt = Math.max(-0.9, Math.min(0.9, Math.atan2(Math.sin(a), Math.abs(Math.cos(a)) || 1e-6)));
    ctx.rotate(tilt);
    const kick = moving ? Math.sin(t * 10) * 0.25 * s : Math.sin(t * 3) * 0.08 * s;
    ctx.fillStyle = "#1e4f7a";                                                                                            // chân + chân vịt
    ctx.beginPath(); ctx.moveTo(-0.6 * s, -0.1 * s); ctx.lineTo(-1.4 * s, -0.15 * s + kick); ctx.lineTo(-1.9 * s, -0.35 * s + kick); ctx.lineTo(-1.9 * s, 0.05 * s + kick); ctx.lineTo(-0.6 * s, 0.15 * s); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.6 * s, 0.05 * s); ctx.lineTo(-1.4 * s, 0.15 * s - kick); ctx.lineTo(-1.9 * s, 0.0 * s - kick); ctx.lineTo(-1.9 * s, 0.35 * s - kick); ctx.lineTo(-0.6 * s, 0.25 * s); ctx.fill();
    ctx.fillStyle = "#9aa7b0"; ctx.beginPath(); ctx.ellipse(-0.1 * s, -0.38 * s, 0.55 * s, 0.16 * s, 0, 0, Math.PI * 2); ctx.fill(); // bình oxy
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.ellipse(0, 0, 0.75 * s, 0.3 * s, 0, 0, Math.PI * 2); ctx.fill();        // thân
    ctx.fillStyle = "#111"; ctx.beginPath(); ctx.moveTo(0.75 * s, -0.25 * s); ctx.quadraticCurveTo(0.2 * s, -0.55 * s, -0.4 * s, -0.25 * s + kick * 0.4); ctx.lineTo(0.6 * s, -0.1 * s); ctx.fill(); // tóc
    ctx.fillStyle = "#f1c27d"; ctx.beginPath(); ctx.arc(0.95 * s, -0.05 * s, 0.27 * s, 0, Math.PI * 2); ctx.fill();         // mặt
    ctx.fillStyle = "#7fe3ff"; ctx.strokeStyle = "#263238"; ctx.lineWidth = 1.5;                                          // kính lặn
    ctx.beginPath(); ctx.ellipse(1.07 * s, -0.08 * s, 0.13 * s, 0.1 * s, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#f1c27d"; ctx.beginPath(); ctx.ellipse(0.6 * s, 0.3 * s, 0.28 * s, 0.09 * s, 0.4, 0, Math.PI * 2); ctx.fill();   // tay
  }
  ctx.restore();
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 64, bottom = 56;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời + nước
  ctx.fillStyle = "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  const now = performance.now() / 1000;
  // tia nắng xiên mờ
  ctx.save(); ctx.beginPath(); ctx.rect(sx(0), oy, X * s, D * s); ctx.clip();
  for (let i = 0; i < 6; i++) {
    const bx = sx(8 + i * 17 + Math.sin(now * 0.3 + i) * 2);
    ctx.fillStyle = "rgba(255,255,255,0.05)"; ctx.beginPath();
    ctx.moveTo(bx, oy); ctx.lineTo(bx + 2.5 * s, oy); ctx.lineTo(bx + 9 * s, sy(D)); ctx.lineTo(bx + 4 * s, sy(D)); ctx.fill();
  }
  // nền xa: rong + đá mờ
  BACKDROP.forEach(([x, n, sz]) => { if (ok(n)) sprite(n, sx(x), sy(D) - sz * 0.45 * s, sz * s, false, 0.35); });
  ctx.restore();
  // mặt nước gợn sóng
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath();
  for (let x = 0; x <= X; x += 0.5) { const yy = oy + Math.sin(x * 0.7 + now * 2) * 0.12 * s; x ? ctx.lineTo(sx(x), yy) : ctx.moveTo(sx(x), yy); }
  ctx.stroke();
  // đáy cát + rong, đá (chỉ trang trí)
  const tile = 2 * s;
  if (ok("terrain_sand_top_a")) {
    ctx.save(); ctx.beginPath(); ctx.rect(sx(0), oy, X * s, D * s + tile); ctx.clip();
    for (let x = 0; x < X; x += 2) ctx.drawImage(SPR.terrain_sand_top_a, sx(x), sy(D) - tile * 0.55, tile + 1, tile + 1);
    ctx.restore();
  }
  DECOR.forEach(([x, n, sz], i) => {
    if (!ok(n)) return;
    const im = SPR[n], hgt = sz * s * im.naturalHeight / im.naturalWidth, sway = n.startsWith("seaweed") ? Math.sin(now * 1.3 + i) * 0.05 : 0;
    ctx.save(); ctx.translate(sx(x), sy(D) - tile * 0.25); ctx.rotate(sway); ctx.drawImage(im, -sz * s / 2, -hgt, sz * s, hgt); ctx.restore();
  });
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.4)" });
  }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.8), { size: 11, align: "center", color: "#5a3a22" });
  // nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    const nx = sx(n.pos[0]), ny = sy(n.pos[1]);
    // lá nổi + thân rủ xuống nước; còn hoa thì vẽ bông theo màu loại
    ctx.strokeStyle = "rgba(60,120,60,.6)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(nx, ny); ctx.quadraticCurveTo(nx + 0.4 * s, ny + 1.5 * s, nx - 0.2 * s, ny + 3 * s); ctx.stroke();
    ctx.fillStyle = "#3f8f4a"; ctx.beginPath(); ctx.ellipse(nx, ny, 1.1 * s, 0.3 * s, 0, 0.15, Math.PI * 2 - 0.15); ctx.lineTo(nx, ny); ctx.fill();
    ctx.globalAlpha = ready ? 1 : 0.3;
    ctx.fillStyle = kc(n.kind);
    for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + (k - 2) * 0.45; ctx.beginPath(); ctx.ellipse(nx + Math.cos(a) * 0.35 * s, ny - 0.35 * s + Math.sin(a) * 0.35 * s, 0.28 * s, 0.14 * s, a, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = "#fff3b0"; ctx.beginPath(); ctx.arc(nx, ny - 0.3 * s, 0.12 * s, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    text(n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "#234" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.1 * s, { size: 10, align: "center", color: "#fff" });
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    const a = ((f.heading_deg || 0) * Math.PI) / 180, left = Math.cos(a) < 0, spec = FISH_SPRITE[f.kind];
    if (spec && ok(spec[0])) {
      // sprite nhìn sang phải: lật ngang khi bơi sang trái, nghiêng nhẹ theo hướng lên/xuống
      const tilt = Math.max(-0.25, Math.min(0.25, Math.atan2(Math.sin(a), Math.abs(Math.cos(a)) || 1e-6)));
      ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(left ? -tilt : tilt);
      sprite(spec[0], 0, Math.sin(performance.now() / 300 + f.pos[0]) * 0.05 * s, spec[1] * s, left);
      ctx.restore();
    } else {
      ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(a);
      ctx.fillStyle = kc(f.kind);
      ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
      ctx.restore();
    }
    text(KIND_NAME[f.kind] || f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.9 * s, { size: 10, align: "center", color: "rgba(255,255,255,.7)" });
  });
  // Cá Sấu (snapshot có `monsters`, trước đây client chưa vẽ)
  (snap.monsters || []).forEach((m) => {
    const prev = lastPos[m.id], mx = sx(m.pos[0]), my = sy(m.pos[1]);
    let left = prev ? prev.left : false;
    if (prev && Math.abs(m.pos[0] - prev.x) > 1e-3) left = m.pos[0] < prev.x;
    lastPos[m.id] = { x: m.pos[0], left };
    const chase = m.state === "chase";
    ctx.save(); ctx.translate(mx, my); if (left) ctx.scale(-1, 1);
    const body = chase ? "#5d7a2e" : "#4e6b3a", belly = "#c9c48a", sw = Math.sin(performance.now() / 180) * 0.25 * s;

    ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(0, 0.25 * s, 1.3 * s, 0.22 * s, 0, 0, Math.PI); ctx.fill();

    ctx.fillStyle = "#4e6b3a"; ctx.beginPath(); ctx.moveTo(-0.6 * s, 0.4 * s); ctx.lineTo(-0.3 * s, 0.85 * s); ctx.lineTo(0, 0.4 * s); ctx.fill();  // chân
    ctx.beginPath(); ctx.moveTo(0.6 * s, 0.4 * s); ctx.lineTo(0.9 * s, 0.85 * s); ctx.lineTo(1.1 * s, 0.4 * s); ctx.fill();

    ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(1.29 * s, -0.42 * s, 0.06 * s, 0, Math.PI * 2); ctx.fill();

    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) drawDiver(px, py, p, underwater, s);

    if (underwater && Math.random() < 0.06) bubbles.push({ x: p.pos[0] + 0.3, d: p.pos[1] - 0.3, r: 0.15 + Math.random() * 0.2, n: Math.random() < 0.5 ? "bubble_a" : "bubble_b" });

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
// Kenney Roguelike Indoors / Characters (CC0): tilesheet 16×16, cách nhau 1px. Chưa tải xong thì vẽ hình khối như cũ.
const SHEET = {};
[["indoor", "kenney-roguelike/indoor.png"], ["chars", "kenney-roguelike/characters.png"]].forEach(([k, f]) => { const im = new Image(); im.src = "/assets/" + f; SHEET[k] = im; });
const sheetOk = (k) => SHEET[k].complete && SHEET[k].naturalWidth > 0;
function tile(k, col, row, x, y, size) {  // vẽ ô (col,row) căn giữa tại (x, y), cạnh `size` px
  const sm = ctx.imageSmoothingEnabled; ctx.imageSmoothingEnabled = false;
  ctx.drawImage(SHEET[k], col * 17, row * 17, 16, 16, Math.round(x - size / 2), Math.round(y - size / 2), Math.round(size), Math.round(size));
  ctx.imageSmoothingEnabled = sm;
}
const T_STOVE = [14, 14], T_TABLE = [7, 0], T_CHAIR = [0, 2], T_PLANT = [[16, 0], [17, 0]], T_RUG = [19, 13];
const T_COUNTER = [[4, 12], [5, 12], [8, 12], [6, 12], [7, 12], [0, 12]];

const PLAYER_LOOK = [0, 5];
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc", ca_keo_nuong: "Cá kèo nướng", lau_mam: "Lẩu mắm" };
const dishName = (d) => DISH_NAME[d] || d || "?";
function hashStr(str) { let hh = 0; for (const ch of String(str)) hh = (hh * 31 + ch.charCodeAt(0)) | 0; return Math.abs(hh); }
function bowl(x, y, r, steam) {  // tô món ăn đơn giản, có khói khi còn nóng
  ctx.fillStyle = "#f5f0e6"; ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.45, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = "#d9822b"; ctx.beginPath(); ctx.ellipse(x, y, r * 0.9, r * 0.25, 0, 0, Math.PI * 2); ctx.fill();
  if (steam) {

function nonLa(x, y, wd) {  // nón lá của Út Sen
  ctx.fillStyle = "#e9d8a6"; ctx.strokeStyle = "#a88b4a"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x - wd / 2, y); ctx.lineTo(x, y - wd * 0.42); ctx.lineTo(x + wd / 2, y); ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 64, bottom = 40;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  const ts = 1.1 * s;  // cỡ một ô tilesheet (mét → px)
  const art = sheetOk("indoor") && sheetOk("chars");
  // sàn gỗ (ván ngang) + góc bếp lát gạch
  ctx.fillStyle = "#b98a55"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  for (let z = 0; z < Z; z += 0.5) {
    ctx.fillStyle = (z * 2) % 2 ? "#b4834e" : "#bf9160"; ctx.fillRect(sx(0), sy(z + 0.5), X * s, 0.5 * s);
    ctx.strokeStyle = "rgba(90,60,30,.25)"; ctx.lineWidth = 1;
    for (let x = ((z * 2) % 3) * 1.3; x < X; x += 3.1) { ctx.beginPath(); ctx.moveTo(sx(x), sy(z + 0.5)); ctx.lineTo(sx(x), sy(z)); ctx.stroke(); }
  }
  const kx = 7, kz = 6.2;  // góc bếp: x < 7, z > 6.2
  for (let x = 0; x < kx; x += 0.5) for (let z = kz; z < Z; z += 0.5) {
    ctx.fillStyle = ((x + z) * 2) % 2 ? "#d9d4c7" : "#c8c2b3"; ctx.fillRect(sx(x), sy(Math.min(Z, z + 0.5)), 0.5 * s + 1, Math.min(0.5, Z - z) * s + 1);
  }
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  text("BẾP", sx(0.3), sy(kz) - 4, { size: 11, color: "rgba(60,40,20,.6)" });
  if (art) {
    // quầy bếp dọc tường trên, cây cảnh, thảm cửa vào
    for (let i = 0, x = 0.55; x < kx; x += ts / s, i++) { const t = T_COUNTER[i % T_COUNTER.length]; tile("indoor", t[0], t[1], sx(x), sy(Z) + ts / 2, ts); }
    tile("indoor", T_PLANT[0][0], T_PLANT[0][1], sx(X - 0.6), sy(Z - 0.6), ts);
    tile("indoor", T_PLANT[1][0], T_PLANT[1][1], sx(X - 0.6), sy(0.6), ts);
    tile("indoor", T_PLANT[0][0], T_PLANT[0][1], sx(kx + 0.6), sy(Z - 0.6), ts);
    tile("indoor", T_RUG[0], T_RUG[1], sx(4), sy(0.6), ts * 1.4);
  }
  // bếp
  (snap.stoves || []).forEach((st) => {
    const x = sx(st.pos[0]), y = sy(st.pos[1]);
    if (art) {
      tile("indoor", T_STOVE[0], T_STOVE[1], x, y, 1.5 * s);
      if (st.state === "cooking") {  // lửa nhấp nháy ở cửa lò
        const fl = 0.6 + 0.4 * Math.sin(performance.now() / 90 + st.pos[0]);
        const gr = ctx.createRadialGradient(x, y + 0.2 * s, 0, x, y + 0.2 * s, 0.45 * s);
        gr.addColorStop(0, `rgba(255,${180 + 50 * fl | 0},60,${0.5 + 0.4 * fl})`); gr.addColorStop(1, "rgba(255,90,0,0)");
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y + 0.2 * s, 0.45 * s, 0, Math.PI * 2); ctx.fill();
      }
      if (st.state === "ready") { ctx.strokeStyle = "#7CFC00"; ctx.lineWidth = 3; ctx.strokeRect(x - 0.8 * s, y - 0.8 * s, 1.6 * s, 1.6 * s); }
    } else {
      ctx.fillStyle = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
      ctx.fillRect(x - 0.8 * s, y - 0.8 * s, 1.6 * s, 1.6 * s);
    }
    if (st.dish) bowl(x, y - 0.45 * s, 0.3 * s, st.state !== "idle");
    const dn = st.dish ? " · " + dishName(typeof st.dish === "string" ? st.dish : st.dish.dish_id) : "";
    text(st.id + dn, x, y + 1.0 * s, { size: 11, align: "center", color: "#3e2a14" });
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) text("🔥 " + Math.ceil(st.cook_ticks_left / 60) + "s", x, y + 1.0 * s + 16, { size: 12, align: "center", color: "#8a2b00" });
    if (st.state === "ready") text("Chín! (E)", x, y + 1.0 * s + 16, { size: 12, align: "center", color: "#2e7d32" });
  });
  // bàn + khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    const x = sx(tb.pos[0]), y = sy(tb.pos[1]), c = byTable[tb.id];
    if (art) {
      tile("indoor", T_CHAIR[0], T_CHAIR[1], x, y - 0.85 * s, 0.95 * s);
      if (c) { const lk = CUSTOMER_LOOKS[hashStr(c.id || tb.id) % CUSTOMER_LOOKS.length]; tile("chars", lk[0], lk[1], x, y - 1.0 * s, 1.15 * s); }
      tile("indoor", T_TABLE[0], T_TABLE[1], x, y, 1.5 * s);
    } else {

      if (c) { ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(x, y - 1.5 * s, 0.55 * s, 0, Math.PI * 2); ctx.fill(); }
    }
    text(tb.id, x, y + 0.95 * s, { size: 11, align: "center", color: "#3e2a14" });
    if (!c) return;
    const cy = y - 1.0 * s;
    if (c.state === "eating") {
      bowl(x, y, 0.4 * s, true);
      text("đang ăn " + Math.ceil((c.eat_ticks_left || 0) / 60) + "s", x, y + 0.75 * s, { size: 10, align: "center", color: "#1b5e20" });
    } else {

      if (c.order_status) text(ST[c.order_status] || c.order_status, x, by - 20, { size: 9, align: "center", color: c.order_status === "unfulfillable" ? "#c62828" : "#5d4037" });
      if (c.patience_ticks_left !== undefined) {

  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }

    else { ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill(); }

    }
  }

  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  text(`Tiền ${snap.money ?? 0}k · uy tín ${(snap.reputation ?? 0).toFixed(1)} · điểm ${snap.score ?? 0}`, 110, 28, { size: 16 });
  // v1.2: kho là mảng cá thể {id, kind, fresh}; hiện số lượng theo loại, độ tươi thấp nhất và số hàng ươn
  const groups = {};

    .forEach((e) => { const g = (groups[e.kind] = groups[e.kind] || { n: 0, min: 100, bad: 0 }); g.n++; g.min = Math.min(g.min, e.fresh); if (e.fresh < 30) g.bad++; });
  const stock = Object.keys(groups).sort().map((k) => { const g = groups[k]; return (KIND_NAME[k] || k) + "×" + g.n + " (tươi ≥" + Math.floor(g.min) + (g.bad ? ", ươn " + g.bad : "") + ")"; }).join(", ");
  text("Kho: " + (stock || "(trống)"), 14, 52, { size: 13, color: "#cfd8dc" });
  text("WASD/mũi tên đi · E tương tác (bếp / bàn) · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

// ----- Shop (day): mua nâng cấp, đóng Shop -----

  ctx.fillStyle = "#4fc3f7"; ctx.fillRect(x - r * 0.38 + 2, y - r * 0.05, r * 0.76 - 4, r * 0.3);                     // vạch xanh
  ctx.fillStyle = "#37474f"; ctx.fillRect(x - r * 0.12, y - r * 0.95, r * 0.24, r * 0.28);                            // van
  ctx.fillRect(x - r * 0.3, y - r * 1.0, r * 0.6, r * 0.1);

  ctx.lineTo(x + r * 0.7, y - r * 0.6); ctx.lineTo(x + r * 0.25, y - r * 0.9); ctx.quadraticCurveTo(x, y - r * 0.55, x - r * 0.25, y - r * 0.9);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#eceff1"; ctx.fillRect(x - r * 0.72, y + r * 0.1, r * 1.44, r * 0.14); ctx.fillRect(x - r * 0.73, y + r * 0.45, r * 1.46, r * 0.14);  // dải phản quang
  ctx.fillStyle = "#263238"; ctx.fillRect(x - r * 0.14, y + r * 0.12, r * 0.28, r * 0.1); ctx.fillRect(x - r * 0.14, y + r * 0.47, r * 0.28, r * 0.1);  // khóa
}
function coin(x, y, r) {
  ctx.fillStyle = "#ffca28"; ctx.strokeStyle = "#c79100"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  text("đ", x, y + r * 0.45, { size: r * 1.3, align: "center", color: "#8d6e00" });
}
function rrect(x, y, wd, ht, rad) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, wd, ht, rad) : ctx.rect(x, y, wd, ht); }

// ----- Shop (day): tiệm đồ lặn — mua nâng cấp, đóng Shop -----
function drawShop(w, h) {
  const up = snap.upgrades || {}, act = snap.active_upgrades || {}, meta = snap.meta || {}, money = snap.money ?? 0;
  const W = Math.min(w - 32, 980), H = Math.min(h - 80, 600), ox = (w - W) / 2, oy = 56;
  // phòng: tường + sàn gỗ
  ctx.fillStyle = "#d7c4a3"; ctx.fillRect(ox, oy, W, H * 0.42);
  ctx.fillStyle = "#b98a55"; ctx.fillRect(ox, oy + H * 0.42, W, H * 0.58);
  for (let y = oy + H * 0.42, i = 0; y < oy + H; y += 22, i++) {
    ctx.fillStyle = i % 2 ? "#b4834e" : "#bf9160"; ctx.fillRect(ox, y, W, Math.min(22, oy + H - y));
  }
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(ox, oy, W, H);
  // biển hiệu
  const sw = Math.min(460, W - 40);
  ctx.fillStyle = "#6d4c2f"; rrect(w / 2 - sw / 2, oy + 12, sw, 50, 8); ctx.fill();
  ctx.strokeStyle = "#3e2a14"; ctx.lineWidth = 3; ctx.stroke();
  text("TIỆM ĐỒ LẶN CHỢ NỔI · Ngày " + (snap.day || 1), w / 2, oy + 45, { size: 22, align: "center", color: "#ffe9b0" });
  // chủ tiệm sau quầy (tilesheet Kenney nếu có)
  const art = sheetOk("indoor") && sheetOk("chars"), ty = oy + H * 0.42;
  // kệ trưng bày trên tường: bình oxy và áo phao treo móc, hai bên chủ tiệm
  const shelfY = oy + 92;
  [[-1, iconTank], [1, iconVest]].forEach(([side, icon]) => {
    const x0 = w / 2 + side * 120, x1 = w / 2 + side * Math.min(W / 2 - 70, 400);
    ctx.fillStyle = "#8d6e4b"; ctx.fillRect(Math.min(x0, x1), shelfY + 62, Math.abs(x1 - x0), 8);
    for (let k = 0, n = 4; k < n; k++) icon(x0 + (x1 - x0) * (k + 0.5) / n, shelfY + 30, 22);
  });
  if (art) {
    tile("chars", 0, 10, w / 2, ty - 44, 88);
    const n = Math.floor((W - 48) / 48), x0 = ox + (W - n * 48) / 2;
    for (let k = 0; k < n; k++) tile("indoor", 4 + (k % 3), 12, x0 + k * 48 + 24, ty + 6, 48);
    tile("indoor", 16, 0, ox + 40, ty - 40, 56); tile("indoor", 17, 0, ox + W - 40, ty - 40, 56);
  } else { ctx.fillStyle = "#8d6e4b"; ctx.fillRect(ox + 20, ty - 18, W - 40, 48); }
  text("“Mua gì thì mua lẹ nghen con!”", w / 2, ty - 98, { size: 14, align: "center", color: "#4e342e" });
  // hai món hàng
  const items = [["1", "oxygen", "Bình oxy", iconTank, (e) => "Oxy " + e.oxygen_max_s + " giây"],
                 ["2", "hp", "Áo phao", iconVest, (e) => "Máu tối đa " + e.hp_max]];
  const cw = Math.min(380, (W - 72) / 2), ch = Math.min(220, H * 0.58 - 70), cy = ty + 50;
  items.forEach(([key, id, name, icon, eff], i) => {
    const list = (meta.upgrades || {})[id] || [], lvl = up[id] || 0, maxL = list.length;
    const next = list.find((e) => e.level === lvl + 1), cur = list.find((e) => e.level === lvl);
    const can = next && money >= next.price, cx = w / 2 + (i ? 12 : -12 - cw);
    ctx.fillStyle = can ? "#fffaf0" : "#efe6d6"; rrect(cx, cy, cw, ch, 12); ctx.fill();
    ctx.strokeStyle = can ? "#43a047" : next ? "#9e8b6e" : "#c9a227"; ctx.lineWidth = can ? 4 : 2; ctx.stroke();
    icon(cx + 62, cy + ch / 2 - 6, Math.min(50, ch * 0.26));
    const tx = cx + 124;
    text(`[${key}] ${name}`, tx, cy + 36, { size: 20, color: "#3e2723" });
    for (let k = 0; k < maxL; k++) {  // ô cấp: đã mua / chưa
      ctx.fillStyle = k < lvl ? "#43a047" : "rgba(0,0,0,.15)"; rrect(tx + k * 26, cy + 48, 20, 10, 3); ctx.fill();
    }
    text("cấp " + lvl + "/" + maxL, tx + maxL * 26 + 4, cy + 58, { size: 12, color: "#6d5a45" });
    text("Hiện: " + (cur ? eff(cur) : "cơ bản"), tx, cy + 86, { size: 14, color: "#5d4037" });
    if (next) {
      text("Lên cấp " + next.level + ": " + eff(next), tx, cy + 110, { size: 14, color: "#2e7d32" });
      coin(tx + 10, cy + ch - 34, 11);
      text(next.price + "k", tx + 28, cy + ch - 27, { size: 20, color: can ? "#2e7d32" : "#b71c1c" });
      text(can ? "nhấn " + key + " để mua" : "chưa đủ tiền", cx + cw - 14, cy + ch - 27, { size: 13, align: "right", color: can ? "#2e7d32" : "#8d6e63" });
    } else text("★ ĐÃ TỐI ĐA", tx, cy + ch - 27, { size: 18, color: "#b8860b" });
    if ((act[id] || 0) < lvl) text("có hiệu lực từ Ngày " + ((snap.day || 1) + 1), tx, cy + 132, { size: 12, color: "#1565c0" });
  });
  // ví tiền + đồng hồ tự đóng
  coin(ox + 34, oy + H - 30, 13);
  text(`${money}k`, ox + 54, oy + H - 22, { size: 22, color: "#fff8e1" });
  text(`tổng thu ${snap.earned ?? 0}k · uy tín ${(snap.reputation ?? 0).toFixed(1)}`, ox + 54 + 90, oy + H - 23, { size: 14, color: "#fff3d6" });
  const left = snap.time_left_ticks || 0, maxT = meta.max_ticks || 600;
  bar(ox + W - 250, oy + H - 40, 230, 18, left / maxT, "#ffb74d", "tự đóng sau " + Math.ceil(left / 60) + "s");
  text("Enter: đóng Shop, sang Ngày mới", w / 2, oy + H + 20, { size: 14, align: "center", color: "#9fb3c0" });
  // thông báo mua (sự kiện gần nhất trong ~2 giây)
  const ev = (snap.events || []).filter((e) => (e.name === "bought" || e.name === "buy_failed") && snap.tick - e.tick < 120).pop();
  if (ev) {
    const NAME = { oxygen: "Bình oxy", hp: "Áo phao" }, d = ev.data || {};
    const msg = ev.name === "bought" ? `✔ Đã mua ${NAME[d.upgrade] || d.upgrade} cấp ${d.level} (−${d.price}k)`
      : d.reason === "funds" ? "✖ Không đủ tiền" : d.reason === "max_level" ? "✖ Món này đã tối đa" : "✖ Không mua được";
    ctx.font = "18px system-ui, sans-serif";
    const mw = ctx.measureText(msg).width + 36;
    ctx.fillStyle = ev.name === "bought" ? "rgba(46,125,50,.95)" : "rgba(183,28,28,.95)"; rrect(w / 2 - mw / 2, cy - 44, mw, 34, 17); ctx.fill();
    text(msg, w / 2, cy - 21, { size: 18, align: "center", color: "#fff" });
  }
}

// ----- Ticket-04: ba cảnh báo dễ nhận biết (chữ + biểu tượng), hiện ở cả chế độ tương phản cao -----
function warnings(w, h) {
  const list = [], p = snap.player || {};
  const phase = snap.phase || snap.mode;
  if (phase === "gather" && p.pos) {
    const near = (snap.monsters || []).some((m) => Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]) <= 10 && p.pos[1] >= 10);
    if (near) {
      list.push(["🐊 Thủy quái!", "#ce93d8"]);
      ctx.strokeStyle = hc ? "#ff00ff" : "#ab47bc"; ctx.lineWidth = hc ? 10 : 6; ctx.strokeRect(3, 3, w - 6, h - 6);
    }
    if (p.oxygen_ticks === 0 && !p.at_surface) list.push(["🫧 Hết hơi! Nổi lên ngay", "#ef5350"]);
    else if (p.oxygen_max_ticks && p.oxygen_ticks < p.oxygen_max_ticks * 0.25 && !p.at_surface) list.push(["🫧 Oxy sắp hết", "#ffca28"]);
  }
  if (phase === "quan") {
    const patMax = ((snap.meta || {}).patience_s || 60) * 60;
    const angry = (snap.customers || []).filter((c) => c.state === "waiting" && c.patience_ticks_left < patMax * 0.25);
    if (angry.length) list.push(["😠 Khách sắp giận: " + angry.map((c) => c.table_id).join(", "), "#ff7043"]);
  }
  list.forEach(([msg, color], i) => {
    const size = hc ? 28 : 20, y = h / 2 - 60 + i * (size + 18);
    ctx.font = size + "px system-ui, sans-serif";
    const tw = ctx.measureText(msg).width + 30;
    ctx.fillStyle = hc ? "#000" : "rgba(0,0,0,.6)"; ctx.fillRect(w / 2 - tw / 2, y - size, tw, size + 14);
    if (hc) { ctx.strokeStyle = "#ffff00"; ctx.lineWidth = 3; ctx.strokeRect(w / 2 - tw / 2, y - size, tw, size + 14); }
    text(msg, w / 2, y, { align: "center", size, color: hc ? "#ffff00" : color });
  });
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.filter = hc ? "contrast(1.8) saturate(1.4)" : "none";
  ctx.fillStyle = hc ? "#000" : "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    const phase = snap.phase || snap.mode;
    if (phase === "quan") drawQuan(w, h); else if (phase === "shop") drawShop(w, h); else drawGather(w, h);
    ctx.filter = "none";
    if (snap.mode === "day" && phase !== "shop") {
      const plan = (snap.day_plan || {}).ingredients || {}, got = {};
      (snap.hold || []).forEach((e) => { const k = e.kind || e; got[k] = (got[k] || 0) + 1; });
      const need = Object.keys(plan).sort().map((k) => (KIND_NAME[k] || k) + " " + (got[k] || 0) + "/" + plan[k]).join(" · ");
      text("Ngày " + snap.day + (phase === "gather" ? " · cần lấy: " + need : ""), w - 10, 52, { size: 13, align: "right", color: "#ffe082" });
    }
    warnings(w, h);
    text("H: tương phản cao " + (hc ? "BẬT" : "tắt") + " · Esc/P: tạm dừng", w - 10, 28, { size: 12, align: "right", color: "#9fb3c0" });
    eventLog(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
